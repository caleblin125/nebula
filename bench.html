<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula — benchmark harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05070c;
        color: #dbe6f5;
        font: 12px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      body {
        padding: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7cc7ff;
      }
      #bench-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        z-index: -1;
        opacity: 0.35;
      }
      pre {
        position: relative;
        margin: 0;
        max-width: 900px;
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(4, 8, 16, 0.82);
        border: 1px solid rgba(160, 190, 235, 0.18);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .pass {
        color: #79e0a4;
      }
      .fail {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <h1>Nebula benchmark</h1>
    <canvas id="bench-canvas" aria-label="Benchmark render target"></canvas>
    <pre id="bench-out" aria-live="polite">starting…</pre>
    <script type="module" src="/src/bench.ts"></script>
  </body>
</html>
