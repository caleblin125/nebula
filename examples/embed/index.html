<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Nebula · embed example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060c;
        color: #dce7f7;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #toolbar {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: calc(100vw - 32px);
        padding: 10px;
        border: 1px solid rgba(150, 180, 220, 0.25);
        border-radius: 10px;
        background: rgba(6, 11, 22, 0.82);
        backdrop-filter: blur(8px);
        font-size: 12px;
      }
      button {
        padding: 5px 9px;
        border: 1px solid rgba(150, 180, 220, 0.3);
        border-radius: 6px;
        background: rgba(18, 30, 50, 0.9);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(180, 210, 255, 0.65);
      }
      #status {
        margin: 0 0 2px;
        color: #8fa6c4;
        flex-basis: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="toolbar">
      <p id="status">starting…</p>
      <button type="button" data-camera="default">Orbit</button>
      <button type="button" data-camera="wide">Wide</button>
      <button type="button" data-camera="close">Close</button>
      <button type="button" data-camera="high">High</button>
      <button type="button" data-camera="side">Side</button>
      <button type="button" id="toggle-play">Pause</button>
      <button type="button" id="still">Still at t=0</button>
      <button type="button" id="reseed">New seed</button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
