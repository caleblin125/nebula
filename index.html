<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060c" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Seeded procedural nebula generator: multi-scale density, GLSL filaments and a raymarched volume, rendered in real time with WebGL2."
    />
    <meta name="author" content="Caleb Lin" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nebula — procedural density field" />
    <meta
      property="og:description"
      content="A seeded procedural nebula generator built on WebGL2, TypeScript and raw GLSL."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/caleblin125/nebula/main/screenshots/orion-deep.jpg"
    />
    <meta property="og:image:alt" content="Orion Deep nebula preset" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Nebula — procedural density field</title>
  </head>
  <body>
    <main id="stage">
      <canvas id="nebula-canvas" aria-label="Procedural nebula rendered with WebGL2"></canvas>

      <header class="masthead">
        <h1>NEBULA</h1>
        <p>procedural density field <span class="sep">/</span> WebGL2</p>
      </header>

      <aside class="telemetry" aria-label="Renderer telemetry">
        <div class="telemetry-fps"><span id="stat-fps">—</span><small>fps</small></div>
        <dl>
          <div><dt>frame</dt><dd><span id="stat-ms">—</span> ms</dd></div>
          <div><dt>gpu</dt><dd><span id="stat-gpu">—</span> ms</dd></div>
          <div><dt>buffer</dt><dd><span id="stat-res">—</span></dd></div>
          <div><dt>cost</dt><dd><span id="stat-cost">—</span></dd></div>
          <div><dt>mode</dt><dd><span id="stat-mode">2D</span></dd></div>
        </dl>
      </aside>

      <section id="controls" class="controls" aria-label="Nebula controls"></section>

      <div id="notice" class="notice" hidden></div>

      <noscript>
        <div class="notice">
          <p>Nebula needs JavaScript enabled and a WebGL2 browser.</p>
        </div>
      </noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
